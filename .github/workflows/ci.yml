name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]' ruff==0.12.0 pyright==1.1.414
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pyright
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
      - run: python src/verify.py
      - run: quantum-pinn train --experiment smoke --output /tmp/qpinn-smoke
      - run: quantum-pinn evaluate /tmp/qpinn-smoke/model.pt
