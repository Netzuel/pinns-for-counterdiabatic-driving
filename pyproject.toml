[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-pinn-cd"
version = "1.0.0"
description = "Physics-informed neural networks for optimal counterdiabatic quantum computation"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause-Clear"
license-files = ["LICENSE", "PATENTS.md"]
authors = [{ name = "Antonio Ferrer-Sánchez" }]
keywords = ["physics-informed neural networks", "counterdiabatic driving", "adiabatic gauge potential", "quantum computing"]
dependencies = ["torch==2.11.0", "numpy==2.2.5", "scipy==1.15.3", "h5py==3.16.0"]

[project.urls]
Repository = "https://github.com/Netzuel/pinns-for-counterdiabatic-driving"
Article = "https://doi.org/10.1088/2632-2153/ad450f"
Preprint = "https://arxiv.org/abs/2309.04434"

[project.optional-dependencies]
figures = ["matplotlib==3.10.8"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib==3.10.8"]
test = ["pytest>=8", "matplotlib==3.10.8", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6", "jupyter-client>=8"]

[project.scripts]
quantum-pinn = "quantum_pinn.training:main"

[tool.setuptools]
packages = ["quantum_pinn", "quantum_pinn.data"]
include-package-data = false

[tool.setuptools.package-dir]
"quantum_pinn" = "src/quantum_pinn"
"quantum_pinn.data" = "datasets"

[tool.setuptools.package-data]
"quantum_pinn.data" = ["*.h5", "*.json", "*.txt", "pretrained/*.pt", "results/*.h5", "results/*.csv", "figures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
